# Security headers, included at server level AND in every location that sets its own
# add_header (nginx drops inherited add_header directives as soon as a location defines one).
#
# __API_ORIGIN__ is replaced at image build time with the origin of VITE_API_URL
# (see Dockerfile); an empty value means the API is same-origin.
#
# CSP notes:
# - script-src 'self': Vite emits only external module scripts (no inline JS).
# - style-src 'unsafe-inline': required by Chakra UI / Emotion (runtime <style> tags) and
#   Framer Motion (style attributes). Fonts are self-hosted (@fontsource), so no Google Fonts.
# - img-src: GitHub avatars + data: (inline SVG favicon, Chakra fallbacks).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' __API_ORIGIN__; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

# HSTS only takes effect when the page is served over HTTPS (browsers ignore it on http://).
# This container speaks plain HTTP on :3000; terminate TLS in front of it (Caddy/Traefik/LB)
# and the header is passed through. Add `preload` only once every subdomain is HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
# Legacy equivalent of frame-ancestors 'none' for old browsers.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

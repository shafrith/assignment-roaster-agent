server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    # Hashed build assets (JS chunks, CSS, self-hosted fonts): cache aggressively.
    # add_header here would drop the server-level headers, so the snippet is re-included.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Never cache the SPA shell.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback: client-side routes resolve to index.html (served via the location above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

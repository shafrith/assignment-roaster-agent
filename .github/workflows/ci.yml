name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roaster
          POSTGRES_PASSWORD: roaster
          POSTGRES_DB: assignment_roaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roaster -d assignment_roaster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://roaster:roaster@localhost:5432/assignment_roaster_test
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GITHUB_CLIENT_ID: ci-dummy-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-client-secret
      GITHUB_REDIRECT_URI: http://localhost:8000/api/v1/auth/github/callback
      GITHUB_API_TOKEN: ci-dummy-github-token
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      ANTHROPIC_MODEL: claude-sonnet-5-5
      ROAST_DAILY_LIMIT: "5"
      MAX_REPO_SIZE_MB: "50"
      MAX_SAMPLED_FILES: "30"
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest -m "not live" --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Dependency audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create .env from template
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

      - name: Build images
        run: |
          docker build -t roaster-backend:ci backend
          docker build -t roaster-frontend:ci frontend

      # Fails on CRITICAL/HIGH OS or library vulns that already have a fix.
      - name: Image scan (Trivy)
        run: |
          for image in roaster-backend:ci roaster-frontend:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.56.2 image --no-progress --ignore-unfixed \
              --severity CRITICAL,HIGH --exit-code 1 "$image"
          done
